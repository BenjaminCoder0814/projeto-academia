      />
    </noscript>
    <style>
      /* abertura estática: pinta na hora, antes mesmo do React carregar */
      .abertura {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #fff5f9 0%, #ffe4ef 55%, #f3e8ff 100%);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .abertura svg {
        width: 120px;
        height: 120px;
        animation: bater 1.4s ease-in-out infinite;
      }
      .abertura p {
        margin: 18px 0 0;
        font-size: 17px;
        font-weight: 600;
        color: rgba(43, 30, 40, 0.7);
      }
      @keyframes bater {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .abertura svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="abertura">
        <div>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FF4D8D" />
                <stop offset="100%" stop-color="#C7A9FF" />
              </linearGradient>
            </defs>
            <path
              fill="url(#g)"
              d="M12 21s-6.7-4.35-9.33-8.02C.6 10.1 1.3 6.3 4.2 4.9 6.5 3.8 9 4.6 10.4 6.3L12 8.2l1.6-1.9c1.4-1.7 3.9-2.5 6.2-1.4 2.9 1.4 3.6 5.2 1.53 8.08C18.7 16.65 12 21 12 21z"
            />
          </svg>
          <p>Projetinho de Benjamin pra Isabela 💗</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
